name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          asset="oronbox-network-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p package/lib package/include
          cp "target/${{ matrix.target }}/release/liboronbox_network.so" package/lib/
          cp include/oronbox_network.h package/include/
          cp LICENSE README.md THIRD_PARTY_NOTICES.md package/
          tar -czf "$asset" -C package lib include LICENSE README.md THIRD_PARTY_NOTICES.md
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: oronbox-network-linux-${{ matrix.arch }}.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/lib, package/include | Out-Null
          Copy-Item target/release/oronbox_network.dll package/lib/
          Copy-Item target/release/oronbox_network.dll.lib package/lib/
          Copy-Item include/oronbox_network.h package/include/
          Copy-Item LICENSE,README.md,THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/lib,package/include,package/LICENSE,package/README.md,package/THIRD_PARTY_NOTICES.md -DestinationPath oronbox-network-windows-x86_64.zip
          $hash = (Get-FileHash oronbox-network-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  oronbox-network-windows-x86_64.zip" | Set-Content -NoNewline oronbox-network-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: oronbox-network-windows-x86_64.zip*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package universal library
        run: |
          set -euo pipefail
          asset="oronbox-network-macos-universal.tar.gz"
          mkdir -p package/lib package/include
          lipo -create \
            target/x86_64-apple-darwin/release/liboronbox_network.dylib \
            target/aarch64-apple-darwin/release/liboronbox_network.dylib \
            -output package/lib/liboronbox_network.dylib
          install_name_tool \
            -id "@rpath/liboronbox_network.dylib" \
            package/lib/liboronbox_network.dylib
          cp include/oronbox_network.h package/include/
          cp LICENSE README.md THIRD_PARTY_NOTICES.md package/
          tar -czf "$asset" -C package lib include LICENSE README.md THIRD_PARTY_NOTICES.md
          shasum -a 256 "$asset" > "$asset.sha256"
          rm -rf package/oronbox_network.xcframework package/xcframework-headers
          mkdir -p package/xcframework-headers
          cp include/oronbox_network.h package/xcframework-headers/
          xcodebuild -create-xcframework \
            -library package/lib/liboronbox_network.dylib \
            -headers package/xcframework-headers \
            -output package/oronbox_network.xcframework
          rm -rf package/xcframework-headers
          xcrun --sdk macosx lipo -info package/oronbox_network.xcframework/macos-arm64_x86_64/liboronbox_network.dylib
          xcframework_asset="oronbox-network-macos-universal.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            package/oronbox_network.xcframework "$xcframework_asset"
          shasum -a 256 "$xcframework_asset" > "$xcframework_asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            oronbox-network-macos-universal.tar.gz*
            oronbox-network-macos-universal.xcframework.zip*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build Android native libraries with debug information
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '2'
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o package/jniLibs build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          asset="oronbox-network-android.zip"
          symbols_asset="oronbox-network-android.symbols.zip"
          mkdir -p symbols/android
          ndk_root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk_root"
          llvm_objcopy="$(find "$ndk_root/toolchains/llvm/prebuilt" -name llvm-objcopy -print -quit)"
          llvm_strip="$(find "$ndk_root/toolchains/llvm/prebuilt" -name llvm-strip -print -quit)"
          test -x "$llvm_objcopy"
          test -x "$llvm_strip"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library="package/jniLibs/${abi}/liboronbox_network.so"
            debug_symbols="symbols/android/${abi}/liboronbox_network.so.debug"
            test -f "$library"
            mkdir -p "$(dirname "$debug_symbols")"
            "$llvm_objcopy" --only-keep-debug "$library" "$debug_symbols"
            "$llvm_strip" --strip-unneeded "$library"
          done
          {
            echo "package=oronbox-network"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              library="package/jniLibs/${abi}/liboronbox_network.so"
              debug_symbols="symbols/android/${abi}/liboronbox_network.so.debug"
              echo "${abi}_runtime_sha256=$(sha256sum "$library" | cut -d' ' -f1)"
              echo "${abi}_debug_sha256=$(sha256sum "$debug_symbols" | cut -d' ' -f1)"
            done
          } > symbols/android/manifest.txt
          cp LICENSE README.md THIRD_PARTY_NOTICES.md package/
          (cd package && zip -9 -r "../$asset" jniLibs LICENSE README.md THIRD_PARTY_NOTICES.md)
          (cd symbols && zip -9 -r "../$symbols_asset" android)
          sha256sum "$asset" > "$asset.sha256"
          sha256sum "$symbols_asset" > "$symbols_asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            oronbox-network-android.zip*
            oronbox-network-android.symbols.zip*

  publish:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Finalize Swift Package binary target
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          checksum_file="dist/oronbox-network-macos-universal.xcframework.zip.sha256"
          manifest="macos/oronbox_network/Package.swift"
          test -s "$checksum_file"
          test -f "$manifest"
          checksum="$(awk 'NF { print $1; exit }' "$checksum_file")"
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]

          perl -0pi -e "s#(url: \"https://github\\.com/zxor-org/OronBox-Package-Network/releases/download/)v[^/]+(/oronbox-network-macos-universal\\.xcframework\\.zip\")#\${1}v${version}\${2}#; s#checksum: \"[0-9a-fA-F]+\"#checksum: \"${checksum}\"#" "$manifest"
          grep -Fq "releases/download/v${version}/oronbox-network-macos-universal.xcframework.zip" "$manifest"
          grep -Fq "checksum: \"${checksum}\"" "$manifest"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- "$manifest"; then
            git add "$manifest"
            git commit -m "build(release): pin Swift package binary for ${tag}"
          fi
          git tag -f "$tag" HEAD
          git push origin "refs/tags/${tag}" --force
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
